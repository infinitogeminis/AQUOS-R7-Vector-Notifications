name: Android 14 Vector module integration test

on:
  push:
    branches:
      - test/android14-avd-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android14-vector:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build notification module
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon :app:assembleDebug

      - name: Prepare avdroot and Vector
        run: |
          mkdir -p downloads test-results
          # Build avdroot from current main: release v0.1.1 has a Magisk
          # payload parser that rejects the current official Magisk APK archive.
          go install github.com/ejfkdev/avdroot@main
          cp "$(go env GOPATH)/bin/avdroot" ./avdroot
          chmod +x avdroot
          ./avdroot --version
          # Magisk 31.1 removed assets/stub.apk; avdroot's environment builder
          # still requires it. Pin the last pre-removal stable package.
          ./avdroot magisk fetch --version 29.0 --dest downloads/Magisk-v29.0.apk
          unzip -l downloads/Magisk-v29.0.apk > test-results/magisk-archive-list.txt
          grep -F 'assets/stub.apk' test-results/magisk-archive-list.txt
          curl -fL https://github.com/JingMatrix/Vector/releases/download/v2.2/Vector-v2.2-3080-Release.zip -o downloads/vector.zip
          sha256sum downloads/vector.zip | tee test-results/vector-sha256.txt
          ./avdroot --help > test-results/avdroot-help.txt

      - name: Boot rooted Android 14 and install Vector
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set +e
            mkdir -p test-results
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell getprop ro.build.version.release > test-results/android-version.txt 2>&1
            adb shell getprop ro.build.version.sdk > test-results/android-api.txt 2>&1
            adb shell pidof com.android.systemui > test-results/systemui-pid-before-root.txt 2>&1
            adb exec-out screencap -p > test-results/android14-before-root.png 2>test-results/screencap-before-error.txt
            file test-results/android14-before-root.png > test-results/screenshot-validation.txt
            ./avdroot root --magisk downloads/Magisk-v29.0.apk --yes --timeout 10m > test-results/avdroot-root.log 2>&1
            ROOT_RC=$?
            echo "$ROOT_RC" > test-results/avdroot-exit-code.txt
            if [ "$ROOT_RC" -ne 0 ]; then
              echo "Magisk root failed; stopping before Vector installation." | tee -a test-results/status.txt
              exit "$ROOT_RC"
            fi
            adb wait-for-device
            adb shell su -c id > test-results/root-identity.txt 2>&1
            adb shell su -c 'magisk -v' > test-results/magisk-version.txt 2>&1
            adb push downloads/vector.zip /data/local/tmp/vector.zip > test-results/vector-push.log 2>&1
            adb shell su -c 'magisk --install-module /data/local/tmp/vector.zip' > test-results/vector-install.log 2>&1
            adb reboot
            adb wait-for-device
            adb shell su -c 'magisk -v' > test-results/magisk-after-reboot.txt 2>&1
            adb install -r app/build/outputs/apk/debug/app-debug.apk > test-results/module-apk-install.txt 2>&1
            adb shell pm path org.aquosr7.colorednotifications > test-results/module-package-path.txt 2>&1
            adb shell am start -a android.intent.action.DIAL -d 'tel:*#*#832867#*#*' > test-results/vector-manager-launch.txt 2>&1
            sleep 8
            adb shell uiautomator dump /sdcard/window.xml > test-results/ui-dump-command.txt 2>&1
            adb pull /sdcard/window.xml test-results/vector-manager-window.xml > test-results/ui-dump-pull.txt 2>&1
            adb exec-out screencap -p > test-results/vector-manager.png 2>test-results/screencap-manager-error.txt
            adb logcat -d -t 6000 > test-results/logcat.txt 2>&1
            echo "root_exit=$ROOT_RC" > test-results/status.txt
            adb shell su -c id >> test-results/status.txt 2>&1

      - name: Preserve APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android14-vector-integration-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            downloads/
            test-results/
            avdroot
          if-no-files-found: warn
