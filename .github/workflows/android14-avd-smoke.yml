name: Android 14 AVD smoke test

on:
  push:
    branches:
      - test/android14-avd-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android14-avd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build module APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon :app:assembleDebug

      - name: Boot Android 14 emulator and collect diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            mkdir -p test-results
            adb wait-for-device
            adb shell getprop ro.build.version.release > test-results/android-version.txt 2>&1 || true
            adb shell getprop ro.build.version.sdk > test-results/android-api.txt 2>&1 || true
            adb exec-out screencap -p > test-results/android14-home.png 2> test-results/screencap-error.txt || true
            adb shell id > test-results/adb-identity.txt 2>&1 || true
            adb logcat -d -t 3000 > test-results/logcat.txt 2>&1 || true
            (adb root > test-results/root-status.txt 2>&1 || true)
            adb wait-for-device || true
            adb shell id > test-results/adb-identity-after-root.txt 2>&1 || true
            echo "Diagnostics collection finished; individual command failures are recorded." > test-results/collection-status.txt

      - name: Preserve APK and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android14-avd-smoke-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            test-results/
          if-no-files-found: warn
