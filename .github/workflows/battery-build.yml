name: Build AQUOS R7 Battery Colors Vector APK
on:
  workflow_dispatch:
  push:
    branches: [ fix/separate-battery-fill-hook, feature/aquos-r7-battery-colors ]
    paths:
      - 'battery/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/battery-build.yml'
jobs:
  build-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build separate battery plugin
        # v1.0.6: include Android 14 RecordingCanvas interception
        run: gradle --no-daemon :battery:assembleDebug
      - name: Verify APK package, version and Vector metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="battery/build/outputs/apk/debug/battery-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING"
          grep -F "package: name='org.aquosr7.batterycolors' versionCode='7' versionName='1.0.6'" <<< "$BADGING"

          unzip -p "$APK" META-INF/xposed/module.prop | tee /tmp/module.prop
          unzip -p "$APK" META-INF/xposed/java_init.list | tee /tmp/java_init.list
          unzip -p "$APK" META-INF/xposed/scope.list | tee /tmp/scope.list

          grep -Fx 'minApiVersion=102' /tmp/module.prop
          grep -Fx 'targetApiVersion=102' /tmp/module.prop
          grep -Fx 'staticScope=true' /tmp/module.prop
          grep -Fx 'org.aquosr7.batterycolors.BatteryEntry' /tmp/java_init.list
          grep -Fx 'com.android.systemui' /tmp/scope.list

          unzip -l "$APK" | grep -F 'classes.dex'
      - uses: actions/upload-artifact@v4
        with:
          name: AQUOS-R7-Battery-Colors-Vector-v1.0.6
          path: battery/build/outputs/apk/debug/battery-debug.apk
          if-no-files-found: error
