name: Android 14 KernelSU v3.3.1 emulator integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android14-kernelsu-emulator
  cancel-in-progress: true

jobs:
  kernelsu-avd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build notification module
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble notification APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Download KernelSU v3.3.1 LKM and module stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads test-results
          curl -fL --retry 3 https://github.com/tiann/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk -o downloads/KernelSU-v3.3.1.apk
          curl -fL --retry 3 https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksud-x86_64-linux-android -o downloads/ksud
          curl -fL --retry 3 https://github.com/backslashxx/mountify/releases/download/205/mountify.zip -o downloads/mountify.zip
          curl -fL --retry 3 https://github.com/LSPosed/ZygiskNext/releases/download/v1.5.2/Zygisk-Next-1.5.2-864-a4a72ce-release.zip -o downloads/zygisk-next.zip
          curl -fL --retry 3 https://github.com/JingMatrix/Vector/releases/download/v2.2/Vector-v2.2-3080-Release.zip -o downloads/vector.zip
          chmod 0755 downloads/ksud
          echo "b4a059ace71de2fa65cc7f12b1c58d55fc23ab25e057ee4230ce779742abe450  downloads/KernelSU-v3.3.1.apk" | sha256sum -c -
          echo "5324a1e8f2f3c74dc69624c4cd973fb9bc1d5da3614a2f2e694583f73bd13cbd  downloads/ksud" | sha256sum -c -
          sha256sum downloads/* | tee test-results/download-sha256.txt

      - name: Create and boot Android 14 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          run_sdkmanager() {
            set +e
            yes | timeout 600s sdkmanager "$@"
            local -a pipeline_status=("${PIPESTATUS[@]}")
            set -e
            if (( pipeline_status[1] != 0 )); then
              return "${pipeline_status[1]}"
            fi
          }
          run_sdkmanager --licenses
          run_sdkmanager --install "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator"
          printf 'no\n' | avdmanager create avd --force --name aquosr7-api34 --package "system-images;android-34;google_apis;x86_64" --device "pixel_5" 2>&1 | tee test-results/avdmanager-create.log
          avdmanager list avd 2>&1 | tee test-results/avdmanager-list.log
          test -s "$ANDROID_AVD_HOME/aquosr7-api34.ini"
          test -s "$ANDROID_AVD_HOME/aquosr7-api34.avd/config.ini"
          grep -q '^image.sysdir.1=' "$ANDROID_AVD_HOME/aquosr7-api34.avd/config.ini"
          emulator -avd aquosr7-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > test-results/emulator.log 2>&1 &
          echo $! > test-results/emulator.pid
          adb start-server
          adb wait-for-device
          for i in $(seq 1 240); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot" == "1" ]]; then break; fi
            if ! kill -0 "$(cat test-results/emulator.pid)" 2>/dev/null; then
              tail -200 test-results/emulator.log
              exit 1
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb devices -l | tee test-results/adb-devices.txt

      - name: Activate KernelSU and install module stack
        shell: bash
        run: bash .github/scripts/android14-kernelsu-v331-smoke.sh

      - name: Preserve diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android14-kernelsu-v331-emulator
          path: |
            downloads/
            test-results/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
