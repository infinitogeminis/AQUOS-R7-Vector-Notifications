name: Android 14 KernelSU v3.3.1 emulator integration

on:
  workflow_dispatch:
  push:
    branches:
      - test/android14-avd-smoke
    paths:
      - .github/workflows/android14-kernelsu-v331-probe.yml
      - .github/scripts/android14-kernelsu-v331-smoke.sh
      - app/**
      - gradle/**
      - settings.gradle
      - build.gradle

permissions:
  contents: read

concurrency:
  group: android14-kernelsu-emulator
  cancel-in-progress: true

jobs:
  kernelsu-avd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build notification module
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble notification APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Download KernelSU v3.3.1 LKM and module stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads test-results
          curl -fL --retry 3 https://github.com/tiann/KernelSU/releases/download/v3.3.1/lkm-x86_64-android14-6.1_kernelsu.ko -o downloads/kernelsu-x86_64-android14-6.1.ko
          curl -fL --retry 3 https://github.com/tiann/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk -o downloads/KernelSU-v3.3.1.apk
          curl -fL --retry 3 https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksud-x86_64-linux-android -o downloads/ksud
          curl -fL --retry 3 https://github.com/backslashxx/mountify/releases/download/205/mountify.zip -o downloads/mountify.zip
          curl -fL --retry 3 https://github.com/LSPosed/ZygiskNext/releases/download/v1.5.2/Zygisk-Next-1.5.2-864-a4a72ce-release.zip -o downloads/zygisk-next.zip
          curl -fL --retry 3 https://github.com/JingMatrix/Vector/releases/download/v2.2/Vector-v2.2-3080-Release.zip -o downloads/vector.zip
          chmod 0755 downloads/ksud
          sha256sum downloads/* | tee test-results/download-sha256.txt
          echo "Expected KernelSU LKM SHA256: 91b23e528280ad891a96d455bb323b63ef51c181dc2b62d153c262e4577af78d" | tee test-results/kernelsu-module-expected-sha256.txt
          echo "91b23e528280ad891a96d455bb323b63ef51c181dc2b62d153c262e4577af78d  downloads/kernelsu-x86_64-android14-6.1.ko" | sha256sum -c -

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create and boot Android 14 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator"
          echo "no" | avdmanager create avd --force --name aquosr7-api34 --package "system-images;android-34;google_apis;x86_64" --device "pixel_5"
          mkdir -p test-results
          emulator -avd aquosr7-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > test-results/emulator.log 2>&1 &
          echo $! > test-results/emulator.pid
          adb start-server
          adb wait-for-device
          for i in $(seq 1 240); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot" == "1" ]]; then break; fi
            if ! kill -0 "$(cat test-results/emulator.pid)" 2>/dev/null; then
              tail -200 test-results/emulator.log
              exit 1
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb devices -l | tee test-results/adb-devices.txt

      - name: Activate KernelSU and install module stack
        shell: bash
        run: bash .github/scripts/android14-kernelsu-v331-smoke.sh

      - name: Preserve diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android14-kernelsu-v331-emulator
          path: |
            downloads/
            test-results/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
