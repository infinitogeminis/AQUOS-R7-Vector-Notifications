name: Build AQUOS R7 Vector module
on:
  workflow_dispatch:
  push:
    branches: [ main, test/android14-avd-smoke ]
    paths:
      - app/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - .github/workflows/build.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build colored notification icon module
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AQUOS-R7-Colored-Notifications.apk
          sha256sum dist/AQUOS-R7-Colored-Notifications.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AQUOS-R7-Colored-Notifications-APK
          path: |
            dist/AQUOS-R7-Colored-Icons-Vector-Bundle.zip
            dist/AQUOS-R7-Colored-Icons/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
