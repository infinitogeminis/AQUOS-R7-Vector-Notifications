plugins { id 'com.android.application' }
android {
 namespace 'org.aquosr7.colorednotifications'
 compileSdk 35
 defaultConfig {
  applicationId 'org.aquosr7.colorednotifications'
  minSdk 26
  targetSdk 35
  versionCode 19
  versionName '1.0.19'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.resources.srcDirs += 'src/main/resources'
 packaging { resources { merges += 'META-INF/xposed/*' } }
 buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
}
dependencies { compileOnly 'io.github.libxposed:api:102.0.0' }
